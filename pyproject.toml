[project]
name = "zoom-ai-debate"
version = "0.1.0"
description = "AI-powered dual-voice conversation synthesis for Zoom meetings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "anthropic>=0.43.0",
    "websockets>=14.0",
    "numpy>=1.26.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
zoom = [
    "PyJWT>=2.9.0",
    "PyQt5>=5.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
